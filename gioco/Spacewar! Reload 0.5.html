  SPACEWAR! DA SISTEMARE
  Programmazione I, IUDAV, Corso Game 2026/27. Il gioco della settimana, da portare il 27/10.

  COS'E'
  Spacewar! (MIT, 1962) e' uno dei primi videogiochi fatti con un vero programma:
  due astronavi si sfidano intorno a una stella. Qui e' rifatto in JavaScript e gira nel browser.
  Questa versione si muove ma non funziona ancora: le navi non sparano e nessuno fa punti.

  COME SI GIOCA
  Doppio clic su questo file: si apre in Chrome. Premete 1 per due giocatori, 2 contro il computer.
  Nave ROSSA: A e D girano, W spinge, S frena, Q spara.
  Nave BLU: frecce sinistra e destra girano, su spinge, giu' frena, spazio spara.

  COME SI MODIFICA
  1. Aprite la cartella in Visual Studio Code e aprite questo file.
  2. Il codice del gioco e' nel blocco <script id="cart">, piu' in basso. Il MOTORE in alto non si tocca.
  3. Cambiate il codice, salvate (Ctrl+S, Cmd+S su Mac) e ricaricate Chrome (F5, Cmd+R su Mac).

  COSA FARE, IN ORDINE (cercate "TODO" con Ctrl+F)
  TODO 1  fire()     le navi devono sparare
  TODO 2  onHit()    un colpo deve dare un punto
  TODO 3  explode()  la nave colpita deve esplodere
  Poi le righe con "MODIFICA": velocita', colori, tasti.
  BONUS   gravity()  la stella al centro attira le navi

  COLORI
  Un colore si scrive in tre modi: un numero da 0 a 15 (la posizione nella lista PAL, nel MOTORE),
  un codice esadecimale tra apici come '#ff4400', oppure un nome inglese tra apici come 'gold' o 'hotpink'.
  const GREEN = true usa i colori verdi del corso, false i colori classici.

  La soluzione e' in esercizio-spacewar-completo.html: guardatela solo dopo averci provato.
-->

<canvas id="screen" tabindex="0"></canvas>
<script>
// ============================================================
// MOTORE: NON MODIFICARE
// Queste funzioni imitano la console TIC-80 (cls, pix, circ, tri, print, key, sfx, time)
// cosi' il gioco gira direttamente nel browser. I colori si cambiano piu' sotto, in PAL.
// ============================================================
const GREEN = false
const S = 4, W = 240, H = GREEN ? Math.max(136, Math.min(420, Math.round(240 * innerHeight / Math.max(1, innerWidth)))) : 136
const cv = document.getElementById('screen'), g = cv.getContext('2d')
cv.width = W * S; cv.height = H * S
const PAL = GREEN
  ? ['#0A0F0A', '#0E3B1F', '#6F00FF', '#7DFFB0', '#D8FFE6', '#00B847', '#008A3A', '#0F5C2E', '#123A22', '#1F7A44', '#B8FFD2', '#5CE69A', '#E8FFF0', '#9DC9A4', '#3E5744', '#1E2A22']
  : ['#1a1c2c', '#5d275d', '#b13e53', '#ef7d57', '#ffcd75', '#a7f070', '#38b764', '#257179', '#29366f', '#3b5dc9', '#41a6f6', '#73eff7', '#f4f4f4', '#94b0c2', '#566c86', '#333c57']
if (GREEN) document.body.style.background = PAL[0]
const col = (c) => typeof c === 'string' ? c : PAL[((c | 0) % 16 + 16) % 16]   // un numero 0..15 dalla lista PAL, oppure un colore scritto: '#ff4400' o 'gold'
const dot = (x, y) => g.fillRect(Math.round(x) * S, Math.round(y) * S, S, S)

function cls(c = 0) { g.fillStyle = col(c); g.fillRect(0, 0, cv.width, cv.height) }
function pix(x, y, c) { g.fillStyle = col(c); dot(x, y) }
const T0 = performance.now()
function time() { return performance.now() - T0 }   // milliseconds since the start, like TIC-80
function circ(x, y, r, c) {
  g.fillStyle = col(c); r = Math.round(r)
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8)); g.fillRect((Math.round(x) - w) * S, (Math.round(y) + dy) * S, (w * 2 + 1) * S, S) }
}
function circb(x, y, r, c) { ellib(x, y, r, r, c) }
function ellib(x, y, a, b, c) {
  g.fillStyle = col(c)
  const n = Math.max(24, Math.ceil((a + b) * 4))
  for (let i = 0; i < n; i++) { const t = (i / n) * Math.PI * 2; dot(x + Math.cos(t) * a, y + Math.sin(t) * b) }
}
function tri(x1, y1, x2, y2, x3, y3, c) {

}
function print(text, x = 0, y = 0, c = 15, fixed = false, scale = 1, small = false) {
  text = String(text)
  if (GREEN && text === 'SPACEWAR!' && scale > 1) {   // the title as the figlet "slant" logo, one monospace character per 3x6 cell
    const ART = ["   _____ ____  ___   _____________       _____    ____  __", "  / ___// __ \\/   | / ____/ ____/ |     / /   |  / __ \\/ /", "  \\__ \\/ /_/ / /| |/ /   / __/  | | /| / / /| | / /_/ / / ", " ___/ / ____/ ___ / /___/ /___  | |/ |/ / ___ |/ _, _/_/  ", "/____/_/   /_/  |_\\____/_____/  |__/|__/_/  |_/_/ |_(_)   ", "                                                          "], cw = 3.2, chh = 6
    // measure only the inked columns, so the centred logo is centred for real (the art has blank margins)
    const lead = Math.min(...ART.filter((l) => l.trim()).map((l) => l.search(/\S/))), end = Math.max(...ART.map((l) => l.trimEnd().length))
    const w = Math.ceil((end - lead) * cw)
    if (y < 0 || y > H) return w
    g.fillStyle = col(c); g.textBaseline = 'top'; g.font = `700 ${chh * S}px "Audiowide", monospace`
    ART.forEach((line, r) => [...line].forEach((ch, i) => { if (ch !== ' ') g.fillText(ch, (x + (i - lead) * cw) * S, (y - 6 + r * chh) * S) }))
    return w
  }
  if (GREEN && fixed && small) {   // the ASCII art title: one character per 4x6 cell, like TIC-80's small fixed font
    const w = text.length * 4
    if (y < 0 || y > H) return w
    g.fillStyle = col(c); g.textBaseline = 'top'; g.font = `700 ${6 * S}px "Audiowide", monospace`
    for (let i = 0; i < text.length; i++) if (text[i] !== ' ') g.fillText(text[i], (x + i * 4) * S, y * S)
    return w
  }
  if (GREEN) {   // the deck fonts: VT323 for the big title, JetBrains Mono for the rest
    g.font = scale > 1 ? `${11 * scale * S}px Audiowide, monospace` : `600 ${(small ? 5 : 6) * S}px "Audiowide", monospace`
    const w = Math.ceil(g.measureText(text).width / S)
    if (y < 0 || y > H) return w
    g.fillStyle = col(c); g.textBaseline = 'top'; g.fillText(text, x * S, (y - (scale > 1 ? 4 : 0)) * S)
    return w
  }
  const cw = (small ? 4 : 6) * scale, w = text.length * cw
  if (y < 0 || y > H) return w   // TIC carts measure text by printing it off screen
  g.fillStyle = col(c); g.textBaseline = 'top'
  g.font = `bold ${(small ? 5 : 7) * scale * S}px "Audiowide", monospace`
  for (let i = 0; i < text.length; i++) g.fillText(text[i], (x + i * cw) * S, y * S)
  return w
}

// TIC-80 key codes: A..Z = 1..26, 0..9 = 27..36, space 48, return 50, up 58, down 59, left 60, right 61
const CODE = {}
for (let i = 0; i < 26; i++) CODE['Key' + String.fromCharCode(65 + i)] = i + 1
for (let i = 0; i < 10; i++) { CODE['Digit' + i] = 27 + i; CODE['Numpad' + i] = 27 + i }
Object.assign(CODE, { Space: 48, Enter: 50, NumpadEnter: 50, ArrowUp: 58, ArrowDown: 59, ArrowLeft: 60, ArrowRight: 61 })
const held = new Set(), fresh = new Set()
function key(k) { return held.has(k) }
function keyp(k) { return fresh.has(k) }
addEventListener('keydown', (e) => { const k = CODE[e.code]; if (k == null) return; e.preventDefault(); if (!held.has(k)) fresh.add(k); held.add(k); audio() })
addEventListener('keyup', (e) => { const k = CODE[e.code]; if (k != null) held.delete(k) })

// sfx(id, note, frames, channel, volume): short Web Audio blips standing in for the cart's sound effects
let ac = null
function audio() { if (!ac) { try { ac = new AudioContext() } catch (e) {} } }
const NOTES = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 }
const freq = (n) => { if (typeof n === 'number') return 440 * Math.pow(2, (n - 57) / 12); const m = /^([A-G]#?)-?(\d)$/.exec(String(n)); return m ? 440 * Math.pow(2, (NOTES[m[1]] + 12 * (+m[2] + 1) - 69) / 12) : 440 }
function sfx(id, note = 'C-4', frames = 10, ch = 0, vol = 15) {
  if (!ac || id < 0) return
  const t = ac.currentTime, d = Math.max(0.03, frames / 60), v = 0.05 * (vol / 15), gain = ac.createGain()
  gain.gain.setValueAtTime(v, t); gain.gain.exponentialRampToValueAtTime(0.0005, t + d); gain.connect(ac.destination)
  if (id === 1) {   // explosion: noise
    const buf = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), data = buf.getChannelData(0)
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1

  } else {
    const o = ac.createOscillator(); o.type = id === 2 ? 'triangle' : 'square'; o.frequency.setValueAtTime(freq(note), t)
    if (id === 0) o.frequency.exponentialRampToValueAtTime(freq(note) / 4, t + d)
    o.connect(gain); o.start(t); o.stop(t + d)
  }
}

function makeShip(name, startX, startY, startAngle, color, keys) {

}

var redShip = makeShip('KYRUS', 50, 68, 0, 2, { left: 60, right: 61, thrust: 58, reverse: 59, fire: 48 })     // A D W S Q
var blueShip = makeShip('ZEN', 190, 68, Math.PI, 10, { left: 1, right: 4, thrust: 23, reverse: 19, fire: 5 })  // frecce e spazio

}

function onHit(ship, shooter) {
  explode(ship.x, ship.y, ship.color)

  // 2. metti la nave fuori gioco per un secondo: ship.deadTimer = 60
  // 3. se c'è chi ha sparato (shooter), dagli un punto: shooter.score++
  // 4. se arriva a POINTS_TO_WIN punti, ha vinto: winner = shooter e gameState = 'win'
}

// Math.cos(angolo) dice quanto andare in orizzontale, Math.sin(angolo) quanto in verticale.
function fire(ship) {

  // Poi il suono: sfx(0, 'C-6', 8, 0)

// ============================================================

function keyboardControls(ship) {
  return {
    turnLeft: key(ship.keys.left),
    turnRight: key(ship.keys.right),
    thrust: key(ship.keys.thrust),
    reverse: key(ship.keys.reverse),
    fire: key(ship.keys.fire) && ship.reloadTimer <= 0,   // tenendo premuto si spara a raffica, con una pausa
  }
}

// L'AI: poche regole scritte a mano, come i fantasmi di Pac-Man
function aiControls(ship) {
  var enemy = enemyOf(ship)
  var angleToEnemy = Math.atan2(enemy.y - ship.y, enemy.x - ship.x)
  var angleToStar = Math.atan2(STAR.y - ship.y, STAR.x - ship.x)
  var enemyDistance = distance(ship, enemy)
  var speed = Math.sqrt(ship.speedX * ship.speedX + ship.speedY * ship.speedY)
  var futurePosition = { x: ship.x + ship.speedX * 40, y: ship.y + ship.speedY * 40 }   // dove sara' fra 40 fotogrammi

  var wantedAngle = angleToEnemy                                                   // regola 1: guarda il nemico
  var starInTheWay = distance(ship, STAR) < enemyDistance && Math.abs(angleToTurn(angleToStar, angleToEnemy)) < 0.6
  if (starInTheWay) wantedAngle = angleToEnemy + 1                                 // regola 2: se la stella è in mezzo, aggirala
  var tooCloseToEnemy = enemyDistance < 45
  if (tooCloseToEnemy) wantedAngle = angleToEnemy + Math.PI                        // regola 3: non andare a sbattere
  var nearStar = distance(ship, STAR) < 45 || distance(futurePosition, STAR) < 30

  var tooFast = speed > 1.2

  var turnNeeded = angleToTurn(wantedAngle, ship.angle)

    turnLeft: turnNeeded < -0.05,

    thrust: facingTheRightWay && (tooFast || ((nearStar || tooCloseToEnemy) && speed < 1.2) || (speed < 0.9 && enemyDistance > 50)),

function updateShip(ship) {

    ship.speedY += Math.sin(ship.angle) * THRUST

  if (controls.reverse) {                       // la retromarcia spinge al contrario

  ship.y = (ship.y + ship.speedY + SCREEN_HEIGHT) % SCREEN_HEIGHT

}

// TIC() è il GAME LOOP: TIC-80 la chiama 60 volte al secondo.
// Ogni volta: si leggono i tasti, si aggiorna il mondo, si ridisegna lo schermo.
function TIC() {
  if (gameState === 'menu') {
    drawMenu()
    if (keyp(28)) startGame(false)   // tasto 1: due giocatori
    if (keyp(29)) startGame(true)    // tasto 2: contro il computer
    return
  }
  if (gameState === 'win') {
    updateParticles()
    drawScene()
    printCentered((winner.isAI ? 'VINCE ' : 'VINCE ') + winner.name + '!', 56, winner.color)
    printCentered('premi INVIO per tornare al menu', 70, 13)
    if (keyp(50)) gameState = 'menu'
    return
  }
  updateShip(redShip)
  updateShip(blueShip)
  if (!redShip.deadTimer && !blueShip.deadTimer && distance(redShip, blueShip) < 8) {   // le navi si scontrano: esplodono tutte e due
    onHit(redShip, null)
    onHit(blueShip, null)
  }
  updateBullets()
  updateParticles()
  drawScene()
}
</script>
<script>
// The cart code, unchanged on disk; the green variant patches its screen size, start positions and text rows, and mutes the music
let acc = 0, last = 0
function loop(t) {   // 60 frames per second, like TIC-80, whatever the screen refresh rate
  acc += Math.min(100, last ? t - last : 16.7); last = t
  while (acc >= 1000 / 60) { TIC(); fresh.clear(); acc -= 1000 / 60 }
  requestAnimationFrame(loop)
}
Promise.resolve(document.getElementById('cart').textContent).then(async (src) => {
  if (GREEN) {
    const cy = Math.round(H / 2)
    src = src.replace(/var SCREEN_HEIGHT = \d+/, 'var SCREEN_HEIGHT = ' + H)
      .replace("'ROSSA', 50, 68,", `'ROSSA', 50, ${cy},`).replace("'BLU', 190, 68,", `'BLU', 190, ${cy},`)
      .replace("(SCREEN_WIDTH - titleWidth) / 2, 44 + row * 6,", `(SCREEN_WIDTH - titleWidth) / 2, ${cy - 24} + row * 6,`)
      .replace("contro il computer', 82,", `contro il computer', ${cy + 8},`)
      .replace("winner.name + '!', 56,", `winner.name + '!', ${cy - 12},`).replace("tornare al menu', 70,", `tornare al menu', ${cy + 2},`)
      .replace('var musicOn = true', 'var musicOn = false')
    try { await document.fonts.load('40px VT323'); await document.fonts.load('600 20px "JetBrains Mono"') } catch (e) {}
  }
  const s = document.createElement('script'); s.textContent = src; document.body.appendChild(s)
  requestAnimationFrame(loop)
})
</script>
