<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Il mio gioco</title>
  <style>
    body { margin: 0; background: #041327; display: grid; place-items: center; height: 100vh; }
    canvas { width: 960px; height: 576px; image-rendering: pixelated; border-radius: 8px; }
  </style>
</head>
<body>
  <canvas id="gioco" width="320" height="192"></canvas>
  <script>
    const canvas = document.getElementById("gioco")
    const ctx = canvas.getContext("2d")
    const LARGHEZZA = canvas.width
    const ALTEZZA = canvas.height

    // Buio: un secondo canvas nascosto. Lo copriamo di nero e poi lo "buchiamo" con la torcia
    const buio = document.createElement("canvas")
    buio.width = LARGHEZZA
    buio.height = ALTEZZA
    const bctx = buio.getContext("2d")

    // Costanti: ogni casella della mappa è un quadratino di 16 pixel
    const CASELLA = 16
    const RAGGIO_TORCIA = 56

    // Mappe delle stanze: # muro, . pavimento, E uscita. Ogni stanza è 20 x 12 caselle
    const INIZIO = [
      "#########..#########",
      "#..................#",
      "#.##............##.#",
      "#.##............##.#",
      "#..................#",
      "....................",
      "....................",
      "#..................#",
      "#.##............##.#",
      "#.##............##.#",
      "#..................#",
      "#########..#########",
    ]
    const CORRIDOI = [
      "#########..#########",
      "#..................#",
      "#.#.#.#.#.#.#.#.#..#",
      "#..................#",
      "#.#.#.#.#.#.#.#.#..#",
      "....................",
      "....................",
      "#.#.#.#.#.#.#.#.#..#",
      "#..................#",
      "#.#.#.#.#.#.#.#.#..#",
      "#..................#",
      "#########..#########",
    ]
    const LABIRINTO = [
      "#########..#########",
      "#..................#",
      "#.########.#######.#",
      "#................#.#",
      "#.##############.#.#",
      "....................",
      "....................",
      "#.#.##############.#",
      "#................#.#",
      "#.########.#######.#",
      "#..................#",
      "#########..#########",
    ]
    const PILASTRI = [
      "#########..#########",
      "#..................#",
      "#..#..#....#..#....#",
      "#..................#",
      "#....####..####....#",
      "....................",
      "....................",
      "#....####..####....#",
      "#..................#",
      "#..#..#....#..#....#",
      "#..................#",
      "#########..#########",
    ]
    const SALA_MOSTRO = [
      "#########..#########",
      "#..................#",
      "#..................#",
      "#.......####.......#",
      "#.......#..#.......#",
      "....................",
      "....................",
      "#.......#..#.......#",
      "#.......####.......#",
      "#..................#",
      "#..................#",
      "#########..#########",
    ]
    const USCITA = [
      "#########..#########",
      "#..................#",
      "#.##.##.##.##.##...#",
      "#..................#",
      "#.##.##.##.##.##...#",
      "....................",
      "....................",
      "#.##.##.##.##.##...#",
      "#..................#",
      "#.......#........E.#",
      "#..................#",
      "#########..#########",
    ]

    // Stanze: il mondo è una griglia di 3 colonne e 2 righe.
    // Qui è scritto cosa c'è in ogni stanza, all'inizio della partita
    const STANZE = [
      [
        { mappa: INIZIO, armi: [], nemici: [{ x: 224, y: 112 }], mostro: null, oggettoMappa: null },
        { mappa: CORRIDOI, armi: [{ x: 80, y: 16 }], nemici: [], mostro: null, oggettoMappa: null },
        { mappa: LABIRINTO, armi: [], nemici: [], mostro: null, oggettoMappa: { x: 80, y: 48 } },
      ],
      [
        { mappa: PILASTRI, armi: [], nemici: [{ x: 64, y: 112 }], mostro: null, oggettoMappa: null },
        { mappa: SALA_MOSTRO, armi: [], nemici: [], mostro: { x: 160, y: 32 }, oggettoMappa: null },
        { mappa: USCITA, armi: [], nemici: [{ x: 256, y: 48 }], mostro: null, oggettoMappa: null },
      ],
    ]

    // Colori: ogni lettera degli sprite diventa un colore
    const COLORI = { h: "#3b2314", s: "#e0ac69", k: "#111111", c: "#4a6fa5", p: "#222a38", w: "#d9d2c5", r: "#ff2a2a", d: "#1a0f1f", g: "#9aa0a6", m: "#d8c79a", b: "#6b4a2b" }

    // Sprite: disegni fatti di lettere, il punto "." è trasparente
    const SPRITE_GIOCATORE = [
      "..hhhh..",
      ".hhhhhh.",
      ".ssksks.",
      ".ssssss.",
      "..cccc..",
      ".cccccc.",
      "..pp.pp.",
      "..pp.pp.",
    ]
    const SPRITE_MOSTRO = [
      "..dddddd..",
      ".dwwwwwwd.",
      "dwwwwwwwwd",
      "dwrrwwrrwd",
      "dwrrwwrrwd",
      "dwwwwwwwwd",
      "dwddddddwd",
      "dwwwwwwwwd",
      ".dwwwwwwd.",
      "..dd..dd..",
    ]
    const SPRITE_ARMA = [
      "kkkkkk",
      "kggggk",
      ".kkk..",
      ".k....",
    ]
    const SPRITE_MAPPA = [
      "bbbbbb",
      "bmmmmb",
      "bmmmmb",
      "bbbbbb",
    ]

    // Variabili: lo stato del gioco
    const giocatore = { x: 20, y: 20, lato: 8, velocita: 1.5, armato: false, munizioni: 0, haMappa: false, dir: { dx: 1, dy: 0 } }
    let mondo = []          // le stanze con il loro stato attuale, si creano in resetta()
    let rx = 0              // colonna della stanza in cui siete
    let ry = 0              // riga della stanza in cui siete
    let visitate = []       // stanze già visitate
    const proiettili = []
    let stato = "gioca" // "gioca", "preso" oppure "fuga"
    let schermo = "menu" // "menu", "comandi" oppure "gioca"
    let voceMenu = 0
    const VOCI_MENU = ["Gioca", "Difficoltà", "Comandi"]
    // Difficoltà: più sono alti i numeri, più il gioco è duro
    const DIFFICOLTA = [
      { nome: "Facile", velocitaNemici: 0.15, munizioni: 9 },
      { nome: "Normale", velocitaNemici: 0.2, munizioni: 6 },
      { nome: "Difficile", velocitaNemici: 0.3, munizioni: 4 },
    ]
    let difficolta = 1 // indice dentro DIFFICOLTA, 1 = Normale
    const tasti = {}

    // Eventi: ricordiamo quali tasti sono premuti, e spariamo con la barra spaziatrice
    addEventListener("keydown", (e) => {
      if (schermo === "menu") {
        if (e.key === "Enter" && e.repeat) return
        gestisciMenu(e.key)
        return
      }
      if (schermo === "comandi") {
        if (e.key === "Enter" || e.key === "Escape") schermo = "menu"
        return
      }
      if (e.key === "Escape") {
        schermo = "menu"
        return
      }
      tasti[e.key] = true
      if (e.key === " " && !e.repeat) spara()
      if (e.key === "Enter" && stato !== "gioca" && !e.repeat) resetta()
    })
    addEventListener("keyup", (e) => { tasti[e.key] = false })

    // Funzione: il menu cambia voce con le frecce e apre la voce scelta con INVIO
    function gestisciMenu(tasto) {
      if (tasto === "ArrowUp" || tasto === "ArrowDown") {
        const passo = tasto === "ArrowDown" ? 1 : VOCI_MENU.length - 1
        voceMenu = (voceMenu + passo) % VOCI_MENU.length
      }
      if (tasto === "Enter") {
        if (voceMenu === 0) {
          resetta()
          schermo = "gioca"
        } else if (voceMenu === 1) {
          difficolta = (difficolta + 1) % DIFFICOLTA.length
        } else {
          schermo = "comandi"
        }
      }
    }

    // Funzione: le scritte del menu, con il nome della difficoltà scelta
    function etichetteMenu() {
      return VOCI_MENU.map((voce, i) => (i === 1 ? "Difficoltà: " + DIFFICOLTA[difficolta].nome : voce))
    }

    // Funzione: la stanza in cui siete ora
    function stanzaAttuale() {
      return mondo[ry][rx]
    }

    // Funzione: dice se un quadratino di lato "lato" nella posizione (x, y) tocca un muro
    function bloccato(x, y, lato) {
      const mappa = stanzaAttuale().mappa
      const angoli = [[x, y], [x + lato - 1, y], [x, y + lato - 1], [x + lato - 1, y + lato - 1]]
      return angoli.some(([px, py]) => {
        const riga = mappa[Math.floor(py / CASELLA)]
        return riga !== undefined && riga[Math.floor(px / CASELLA)] === "#"
      })
    }

    // Funzione: sposta un personaggio un asse alla volta, così scivola lungo i muri
    function muovi(ente, dx, dy) {
      if (!bloccato(ente.x + dx, ente.y, ente.lato)) ente.x += dx
      if (!bloccato(ente.x, ente.y + dy, ente.lato)) ente.y += dy
    }

    // Funzione: tiene un personaggio dentro la stanza (per i nemici)
    function dentroStanza(ente) {
      ente.x = Math.max(0, Math.min(LARGHEZZA - ente.lato, ente.x))
      ente.y = Math.max(0, Math.min(ALTEZZA - ente.lato, ente.y))
    }

    // Funzione: distanza fra i centri di due personaggi
    function distanza(a, b) {
      return Math.hypot((a.x + a.lato / 2) - (b.x + b.lato / 2), (a.y + a.lato / 2) - (b.y + b.lato / 2))
    }

    // Funzione: due cose sono vicine se distano meno di "soglia" pixel
    function vicino(a, b, soglia) {
      return Math.abs(a.x - b.x) < soglia && Math.abs(a.y - b.y) < soglia
    }

    // Funzione: il giocatore si muove con le frecce e ricorda da che parte guarda
    function muoviGiocatore() {
      const dx = (tasti["ArrowRight"] ? 1 : 0) - (tasti["ArrowLeft"] ? 1 : 0)
      const dy = (tasti["ArrowDown"] ? 1 : 0) - (tasti["ArrowUp"] ? 1 : 0)
      if (dx !== 0 || dy !== 0) giocatore.dir = { dx, dy }
      muovi(giocatore, dx * giocatore.velocita, dy * giocatore.velocita)
    }

    // Funzione: passa nella stanza vicina, se esiste
    function cambiaStanza(nuovaRx, nuovaRy) {
      if (nuovaRx < 0 || nuovaRy < 0 || nuovaRx >= mondo[0].length || nuovaRy >= mondo.length) return false
      rx = nuovaRx
      ry = nuovaRy
      visitate[ry][rx] = true
      proiettili.length = 0
      return true
    }

    // Funzione: se il giocatore esce dai bordi della stanza, entra nella stanza accanto
    function controllaUscite() {
      if (giocatore.x < 0) {
        if (cambiaStanza(rx - 1, ry)) giocatore.x = LARGHEZZA - giocatore.lato - 2
        else giocatore.x = 0
      } else if (giocatore.x + giocatore.lato > LARGHEZZA) {
        if (cambiaStanza(rx + 1, ry)) giocatore.x = 2
        else giocatore.x = LARGHEZZA - giocatore.lato
      } else if (giocatore.y < 0) {
        if (cambiaStanza(rx, ry - 1)) giocatore.y = ALTEZZA - giocatore.lato - 2
        else giocatore.y = 0
      } else if (giocatore.y + giocatore.lato > ALTEZZA) {
        if (cambiaStanza(rx, ry + 1)) giocatore.y = 2
        else giocatore.y = ALTEZZA - giocatore.lato
      }
    }

    // Funzione: il mostro si muove (per ora va dritto verso il giocatore)
    function muoviMostro() {
      const mostro = stanzaAttuale().mostro
      if (!mostro) return
      // TODO(human): decidete voi come si muove il mostro, vedi la richiesta qui sotto
      const dx = Math.sign(giocatore.x - mostro.x) * mostro.velocita
      const dy = Math.sign(giocatore.y - mostro.y) * mostro.velocita
      muovi(mostro, dx, dy)
      dentroStanza(mostro)
    }

    // Funzione: i nemici della stanza inseguono il giocatore
    function muoviNemici() {
      for (const nemico of stanzaAttuale().nemici) {
        const dx = Math.sign(giocatore.x - nemico.x) * nemico.velocita
        const dy = Math.sign(giocatore.y - nemico.y) * nemico.velocita
        muovi(nemico, dx, dy)
        dentroStanza(nemico)
      }
    }

    // Funzione: il giocatore spara un proiettile nella direzione in cui guarda
    function spara() {
      if (!giocatore.armato || giocatore.munizioni <= 0) return
      giocatore.munizioni--
      proiettili.push({
        x: giocatore.x + 4,
        y: giocatore.y + 4,
        dx: giocatore.dir.dx * 4,
        dy: giocatore.dir.dy * 4,
      })
    }

    // Funzione: fa avanzare i proiettili e li toglie quando colpiscono un muro o un nemico
    function muoviProiettili() {
      const s = stanzaAttuale()
      for (const p of proiettili) {
        p.x += p.dx
        p.y += p.dy
        if (bloccato(p.x, p.y, 2) || p.x < 0 || p.y < 0 || p.x > LARGHEZZA || p.y > ALTEZZA) p.finito = true
        for (const nemico of s.nemici) {
          const dentro = p.x >= nemico.x && p.x <= nemico.x + nemico.lato && p.y >= nemico.y && p.y <= nemico.y + nemico.lato
          if (dentro) {
            nemico.vita--
            p.finito = true
          }
        }
      }
      s.nemici = s.nemici.filter((n) => n.vita > 0)
      for (let i = proiettili.length - 1; i >= 0; i--) {
        if (proiettili[i].finito) proiettili.splice(i, 1)
      }
    }

    // Funzione: raccoglie armi e mappa quando il giocatore ci passa sopra
    function raccogli() {
      const s = stanzaAttuale()
      for (const arma of s.armi) {
        if (!arma.preso && vicino(giocatore, arma, 12)) {
          arma.preso = true
          giocatore.armato = true
          giocatore.munizioni += DIFFICOLTA[difficolta].munizioni
        }
      }
      const mappaTrovata = s.oggettoMappa
      if (mappaTrovata && !mappaTrovata.preso && vicino(giocatore, mappaTrovata, 12)) {
        mappaTrovata.preso = true
        giocatore.haMappa = true
      }
    }

    // Funzione: aggiorna lo stato, cioè chi ha preso chi e chi è uscito
    function aggiorna() {
      if (schermo !== "gioca" || stato !== "gioca") return
      muoviGiocatore()
      controllaUscite()
      muoviMostro()
      muoviNemici()
      muoviProiettili()
      raccogli()

      const s = stanzaAttuale()
      const preso = (s.mostro && distanza(giocatore, s.mostro) < 9) || s.nemici.some((n) => distanza(giocatore, n) < 9)
      if (preso) stato = "preso"

      const casella = s.mappa[Math.floor((giocatore.y + 4) / CASELLA)][Math.floor((giocatore.x + 4) / CASELLA)]
      if (casella === "E") stato = "fuga"
    }

    // Funzione: ricomincia la partita, rimettendo ogni stanza com'era all'inizio
    function resetta() {
      mondo = STANZE.map((riga) => riga.map((s) => ({
        mappa: s.mappa,
        armi: s.armi.map((a) => ({ ...a, preso: false })),
        nemici: s.nemici.map((n) => ({ x: n.x, y: n.y, lato: 10, velocita: DIFFICOLTA[difficolta].velocitaNemici, vita: 2 })),
        mostro: s.mostro ? { x: s.mostro.x, y: s.mostro.y, lato: 10, velocita: 0.6 } : null,
        oggettoMappa: s.oggettoMappa ? { ...s.oggettoMappa, preso: false } : null,
      })))
      giocatore.x = 20
      giocatore.y = 20
      giocatore.armato = false
      giocatore.munizioni = 0
      giocatore.haMappa = false
      giocatore.dir = { dx: 1, dy: 0 }
      rx = 0
      ry = 0
      visitate = [[true, false, false], [false, false, false]]
      proiettili.length = 0
      stato = "gioca"
    }

    // Funzione: disegna i muri, il pavimento e l'uscita, casella per casella
    function disegnaMappa(mappa) {
      for (let riga = 0; riga < mappa.length; riga++) {
        for (let col = 0; col < mappa[riga].length; col++) {
          const x = col * CASELLA
          const y = riga * CASELLA
          const tipo = mappa[riga][col]

          if (tipo === "#") {
            ctx.fillStyle = "#2b2633"
            ctx.fillRect(x, y, CASELLA, CASELLA)
            // Linee dei mattoni
            ctx.fillStyle = "#1c1921"
            ctx.fillRect(x, y + 7, CASELLA, 1)
            ctx.fillRect(x, y + 15, CASELLA, 1)
            ctx.fillRect(x + 7, y, 1, 7)
            ctx.fillRect(x + 3, y + 8, 1, 7)
            ctx.fillRect(x + 11, y + 8, 1, 7)
          } else {
            ctx.fillStyle = "#17151d"
            ctx.fillRect(x, y, CASELLA, CASELLA)
            if ((col * 7 + riga * 13) % 5 === 0) {
              ctx.fillStyle = "#1f1c26"
              ctx.fillRect(x + 5, y + 6, 2, 2)
            }
          }

          if (tipo === "E") {
            ctx.fillStyle = "#2f8f4e"
            ctx.fillRect(x + 4, y + 2, 8, 14)
          }
        }
      }
    }

    // Funzione: disegna uno sprite un pixel alla volta
    function disegnaSprite(sprite, x, y) {
      for (let riga = 0; riga < sprite.length; riga++) {
        for (let col = 0; col < sprite[riga].length; col++) {
          const colore = COLORI[sprite[riga][col]]
          if (colore) {
            ctx.fillStyle = colore
            ctx.fillRect(Math.round(x) + col, Math.round(y) + riga, 1, 1)
          }
        }
      }
    }

    // Funzione: disegna la piccola mappa in alto a destra, con una casella per stanza
    function disegnaMinimappa() {
      for (let r = 0; r < mondo.length; r++) {
        for (let c = 0; c < mondo[r].length; c++) {
          const attuale = c === rx && r === ry
          const conUscita = mondo[r][c].mappa.some((riga) => riga.includes("E"))
          let colore = "#15121c"
          if (visitate[r][c]) colore = "#8a8298"
          if (giocatore.haMappa) colore = "#3a3446"
          if (giocatore.haMappa && conUscita) colore = "#2f8f4e"
          if (attuale) colore = "#ffd84d"
          ctx.fillStyle = colore
          ctx.fillRect(289 + c * 9, 4 + r * 7, 8, 6)
        }
      }
    }

    // Funzione: copre tutto di buio, tranne un cerchio intorno alla torcia
    function disegnaBuio() {
      bctx.globalCompositeOperation = "source-over"
      bctx.clearRect(0, 0, buio.width, buio.height)
      bctx.fillStyle = "rgba(0, 0, 0, 0.93)"
      bctx.fillRect(0, 0, buio.width, buio.height)

      const cx = giocatore.x + 4
      const cy = giocatore.y + 4
      const luce = bctx.createRadialGradient(cx, cy, 0, cx, cy, RAGGIO_TORCIA)
      luce.addColorStop(0, "rgba(0, 0, 0, 1)")
      luce.addColorStop(1, "rgba(0, 0, 0, 0)")
      bctx.globalCompositeOperation = "destination-out"
      bctx.fillStyle = luce
      bctx.fillRect(0, 0, buio.width, buio.height)

      ctx.drawImage(buio, 0, 0)
    }

    // Funzione: il menu iniziale, con la voce scelta evidenziata
    function disegnaMenu() {
      ctx.fillStyle = "#0a0812"
      ctx.fillRect(0, 0, LARGHEZZA, ALTEZZA)
      ctx.textAlign = "center"

      ctx.fillStyle = "#c0392b"
      ctx.font = "bold 22px monospace"
      ctx.fillText("IL MIO SURVIVAL", LARGHEZZA / 2, 60)

      ctx.font = "bold 12px monospace"
      etichetteMenu().forEach((voce, i) => {
        ctx.fillStyle = i === voceMenu ? "#ffd84d" : "#8a8298"
        ctx.fillText((i === voceMenu ? "> " : "  ") + voce, LARGHEZZA / 2, 110 + i * 22)
      })

      ctx.fillStyle = "#5b5468"
      ctx.font = "9px monospace"
      ctx.fillText("Frecce su e giu per scegliere, INVIO per confermare", LARGHEZZA / 2, 180)
      ctx.textAlign = "left"
    }

    // Funzione: la schermata dei comandi, con un tasto per riga
    function disegnaComandi() {
      const comandi = [
        ["Frecce", "muovi il personaggio"],
        ["Barra spaziatrice", "spara (serve un'arma)"],
        ["Passa sopra", "raccogli armi e mappa"],
        ["Esc", "torna al menu"],
        ["INVIO", "ricomincia dopo la sconfitta"],
        ["Obiettivo", "trova la porta verde E"],
      ]
      ctx.fillStyle = "#0a0812"
      ctx.fillRect(0, 0, LARGHEZZA, ALTEZZA)

      ctx.fillStyle = "#c0392b"
      ctx.font = "bold 16px monospace"
      ctx.fillText("COMANDI", 20, 32)

      comandi.forEach(([tasto, descrizione], i) => {
        const y = 60 + i * 18
        ctx.fillStyle = "#ffd84d"
        ctx.font = "bold 9px monospace"
        ctx.fillText(tasto, 20, y)
        ctx.fillStyle = "white"
        ctx.font = "9px monospace"
        ctx.fillText(descrizione, 130, y)
      })

      ctx.fillStyle = "#5b5468"
      ctx.font = "9px monospace"
      ctx.fillText("INVIO o Esc: torna al menu", 20, 180)
    }

    // Funzione: sceglie cosa mostrare, in base alla schermata attuale
    function disegna() {
      if (schermo === "menu") disegnaMenu()
      else if (schermo === "comandi") disegnaComandi()
      else disegnaGioco()
    }

    // Funzione: disegna la stanza attuale, il buio e poi il testo
    function disegnaGioco() {
      const s = stanzaAttuale()
      disegnaMappa(s.mappa)
      for (const arma of s.armi) {
        if (!arma.preso) disegnaSprite(SPRITE_ARMA, arma.x, arma.y)
      }
      if (s.oggettoMappa && !s.oggettoMappa.preso) disegnaSprite(SPRITE_MAPPA, s.oggettoMappa.x, s.oggettoMappa.y)
      for (const nemico of s.nemici) disegnaSprite(SPRITE_MOSTRO, nemico.x, nemico.y)
      if (s.mostro) disegnaSprite(SPRITE_MOSTRO, s.mostro.x, s.mostro.y)
      disegnaSprite(SPRITE_GIOCATORE, giocatore.x, giocatore.y)

      ctx.fillStyle = "#ffd84d"
      for (const p of proiettili) ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2)

      disegnaBuio()
      disegnaMinimappa()

      ctx.fillStyle = "white"
      ctx.font = "bold 10px monospace"
      ctx.fillText(giocatore.armato ? "Munizioni: " + giocatore.munizioni : "Cerca un'arma", 4, 12)
      if (stato === "preso") ctx.fillText("SEI STATO PRESO - premi INVIO", 40, 96)
      if (stato === "fuga") ctx.fillText("SEI FUGGITO! - premi INVIO", 60, 96)
    }

    // Ciclo: il game loop, circa 60 volte al secondo
    function loop() {
      aggiorna()
      disegna()
      requestAnimationFrame(loop)
    }
    resetta()
    loop()
  </script>
</body>
</html>
